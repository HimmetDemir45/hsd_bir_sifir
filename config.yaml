# OkulKalkan ayarları. Tüm eşikler burada; kodda sabit eşik yok.
# ${DEGISKEN} biçimindeki değerler .env'den okunur.

general:
  device: cpu            # cpu | cuda
  imgsz: 640             # 480–640 arası; CPU yavaşsa 480 yapın
  target_fps: 15         # canlı kamerada işleme hızı üst sınırı. 8'di: poz 2 karede bir -> hareket sn'de ~4 kez
                         # ölçülüyordu, canlı testte kavga/koşuşma hiç algılanmadı (video testleri 13-20 FPS'teydi)
  torch_threads: 4       # CPU çekirdek sınırı (0 = sınırsız). 8 -> 21 FPS / 8.2 çekirdek, 4 -> 16 FPS / 4.6 çekirdek
  max_frame_side: 960    # kare okunur okunmaz uzun kenarı bu piksele küçültülür (0 = kapalı); büyük videolarda FPS'i artırır
  reconnect_s: 3         # webcam/RTSP bu kadar sn kare vermezse yeniden açılır (0 = kapalı)
  snapshot_dir: snapshots
  clip_dir: clips
  clip_pre_ratio: 0.5    # klibin ne kadarı uyarıdan ÖNCE (0.5 -> 10 sn klipte 5 sn önce + 5 sn sonra)
  clip_max_side: 960     # klip kareleri bu boyuta küçültülür (bellek: JPEG tampon ~20 MB)

# Kameralar ve bulundukları bölge
cameras:
  - id: cam1
    source: 0            # 0 = webcam, "rtsp://..." veya "test_media/kavga.mp4"
    zone_id: kantin

# Bölgeler: tip (eşikler tipe göre değişir) + kat planı poligonu (floorplan.png piksel koordinatları)
zones:
  kantin:     {name: Kantin,       type: social,  polygon: [[50, 50], [300, 50], [300, 200], [50, 200]]}
  koridor_1:  {name: 1. Kat Koridor, type: corridor, polygon: [[320, 50], [700, 50], [700, 120], [320, 120]]}
  spor_salonu: {name: Spor Salonu,  type: gym,     polygon: [[50, 220], [400, 220], [400, 450], [50, 450]]}
  bahce:      {name: Bahçe,        type: outdoor, polygon: [[420, 220], [700, 220], [700, 450], [420, 450]]}
  # Sınıf şeridi (planda y 130-210). compact: dar oda; ısı haritasında ad yazılmaz (planda zaten yazılı), sadece sayı rozeti.
  # type: classroom/office için audio.db_thresholds'ta tip yoksa 'default' eşik kullanılır (A'nın bölümü).
  sinif_1a:   {name: Sınıf 1-A,    type: classroom, compact: true, polygon: [[312, 132], [408, 132], [408, 208], [312, 208]]}
  sinif_1b:   {name: Sınıf 1-B,    type: classroom, compact: true, polygon: [[412, 132], [508, 132], [508, 208], [412, 208]]}
  rehberlik:  {name: Rehberlik,    type: office,    compact: true, polygon: [[512, 132], [598, 132], [598, 208], [512, 208]]}
  mudur_yrd:  {name: Müdür Yrd.,   type: office,    compact: true, polygon: [[602, 132], [648, 132], [648, 208], [602, 208]]}
  wc:         {name: WC,           type: corridor,  compact: true, polygon: [[652, 132], [708, 132], [708, 208], [652, 208]]}

# Ders / teneffüs çizelgesi (HH:MM). Bu aralıklar dışındaki zaman "ders" sayılır.
schedule:
  breaks:
    - ["10:10", "10:20"]
    - ["11:00", "11:10"]
    - ["12:30", "13:20"]   # öğle arası
    - ["14:00", "14:10"]

# ---------------- Detektörler ----------------
weapon:
  # Birden fazla model birlikte çalışır; dosyası olmayan model uyarıyla atlanır.
  # class_map: modelin sınıf adı (küçük harf) -> event tipi; listede olmayan sınıflar yok sayılır.
  models:
    # Tabanca/tüfek: KENDİ EĞİTTİĞİMİZ YOLO11n (Dangerous Items, Zenodo CC BY 4.0, 5934 görüntü, GPU 40 tur).
    # Ayrılmış test seti: tabanca P 0.91 R 0.81 mAP50 0.89, tüfek mAP50 0.93 (genel 0.87). docs/DEGERLENDIRME.md
    # Tek model hem tabanca hem bıçak: COCO'nun bıçak sınıfı bu veri setinin testinde %5 yakalıyordu (bizimki %59-69).
    # v2 = v1 + 1032 zor negatif kare (silahsız güvenlik kamerası/gündelik; tools/negatif_ornek.py), ince ayar.
    - path: ml/silah_v2.pt         # repoda (5 MB): ekip ek kurulum yapmadan kullanır
      class_map: {gun: gun, rifle: gun, knife: knife, machete: knife}
  # Tip başına KIRMIZI güven eşiği. Ölçüm: veri seti TEST bölümü (yakalama) + eğitimde görülmemiş 72 silahsız
  # güvenlik kamerası klibi (yanlış kırmızı, 3/5 kare kuralı). v2 @0.6: tabanca %74 / 0/72, bıçak %71 / 0/72
  # (v1 eski ayar: tabanca 0.65 %79 / 3/72, bıçak 0.7 %66 / 2/72). alerts.red.weapon_min_conf altına inmez.
  min_conf: {gun: 0.6, knife: 0.6}
  display_conf: 0.35     # bu ve üstü ekranda (gri) gösterilir; event üretmez
  window: 5              # son N kare
  min_hits: 3            # ...en az bu kadarında tespit
  emit_cooldown_s: 2.0   # aynı tip event'i detektör bu sıklıktan fazla basmaz (asıl dedup fusion'da)
  # Modeller karelere sırayla dağıtılır (kare başına tek model). İkisi birlikte FPS'i 13 -> 7-11'e düşürüp
  # demo videosunda kavga tespitini kaybettirdi. Her tip yine sn'de ~7 kez kontrol edilir (window 5 ~ 0.7 sn).
  alternate_models: true

pose:
  model: models/yolo11n-pose.pt
  every_n_frames: 2
  person_conf: 0.5             # kişi kutusu güven eşiği
  kp_conf: 0.4                 # keypoint bu güvenin altındaysa yok sayılır
  track_max_dist: 0.8          # kareler arası eşleştirme: merkez kayması < kişi boyu * oran
  track_ttl_s: 1.0             # bu süre görünmeyen kişi takipten düşer
  speed_ema: 0.5               # hız yumuşatma (0 = yumuşatma yok, 1'e yakın = çok yumuşak)
  emit_cooldown_s: 3.0         # aynı tip event'i detektör bu sıklıktan fazla basmaz
  fight:
    proximity_ratio: 0.6       # merkezler arası mesafe < kişi boyu * oran
    limb_speed: 1.5            # bilek/dirsek hızı (kişi boyu / sn)
    hold_s: 0.5                # hızlı hareket bu kadar süre "devam ediyor" sayılır (vuruşlar arası boşluk)
    gap_s: 0.7                 # kavga durumu bu kadar süre kesilirse sayaç sıfırlanır (kısa kopmaları tolere eder)
    min_duration_s: 0.5        # canli.mp4: gerçek itişme kesik kesik, kavga durumu en fazla ~0.7 sn sürüyordu.
                               # 1.0 -> 0.5: kayıtta kavga 1 -> 6 uyarı; veri seti yakalama %7 -> %12, yanlış %2 -> %3
  fall:
    torso_angle_deg: 60        # gövdenin dikeyle açısı bundan büyükse "yatay"
    aspect_ratio: 1.2          # omuz+kalça görünmüyor ama bacaklar görünüyorsa: kutu genişlik/yükseklik > bu ise "yatay"
    min_duration_s: 2.0        # 3.0'dı: canli.mp4'te iterek düşürülen kişi yerde 2.4 sn kalıp kalktı; UR Fall'da
                               # yerde kalma 0.4-2.0 sn. Bıçak/koşma/kavga bölümlerinde hiç yatay duruş yok.
    require_sudden: true       # yataya geçiş ani olmalı (yavaşça uzanma düşme sayılmaz; UR Fall değerlendirmesi)
    transition_s: 1.0          # ...yatay olmadan en fazla bu kadar sn önce dik duruyordu
    drop_ratio: 0.15           # ...ve o andan beri kutu merkezi en az bu kadar x boy aşağı indi (UR Fall: aynı yakalamada yanlış alarm %36 -> %14)
    gap_s: 0.5                 # yatay duruş bu kadar kısa kesilirse (duruş titremesi) süre sıfırlanmaz
  running:
    # canli.mp4: koşan kişi kadrajda tek ve ~0.7 sn görünüyordu (2 kişi şartı ve 0.5 sn hiç sağlanmadı).
    # Hız 2.0 (1.2 değil): yakın kamerada el sallamak 1.35, itişme 2.19'a kadar çıkıyor. Kayıtta 2/2 koşu,
    # bıçak/kavga bölümlerinde yanlış koşma yok; kavga veri setinde %0-1.
    mean_speed: 2.0            # ortalama keypoint hızı (kişi boyu / sn)
    min_people: 1
    min_duration_s: 0.3
  # Öğrenilmiş kavga modeli (tools/kavga_egit.py; veri setleri: Surveillance Fight, RLVS, Movies Fights).
  # Açıkken kavga kararını kural yerine model verir; dosya yoksa kural (fight:) kullanılır.
  fight_model:
    enabled: true
    path: ml/kavga_model.joblib
    threshold: null            # null: eğitimde CV ile seçilen eşik (model dosyasında)
    eval_every_s: 0.5          # olasılık bu sıklıkta hesaplanır (pencere: modelin window_s'i)
    min_consecutive: 1         # 1: eğitimdeki ölçümle aynı (klip kararı = en yüksek pencere); 2 raporlanandan az yakalıyordu
    # Modele EK "hızlı temas" kuralı (yumruk/itme): bilek karşı kişinin kutusuna wrist_d (kişi boyu) kadar yakın VE
    # kol hızı >= limb_speed (boy/sn), aynı karede; span_s içinde min_windows pencerede -> kavga.
    # Ölçüm: canli.mp4 itişme/vurma %65, boğuşma %83 pencere; bıçak gösterme/koşma/kendi düşme %0.
    # Görülmemiş normal klip yanlış alarmı: Surveillance %2, Movies %0, RLVS %18 (kalabalık spor/sarılma).
    strike: {enabled: true, wrist_d: 0.1, limb_speed: 2.0, min_windows: 2, span_s: 3.0}
  crowd:
    min_people: 4
    radius_ratio: 1.5          # kişi boyu cinsinden kümelenme yarıçapı

audio:
  backend: efficientat   # efficientat (daha isabetli) | yamnet (yedek). efficientat yüklenemezse otomatik yamnet.
  input: default         # mikrofon: default veya cihaz numarası (python -m detectors.audio_cls --list-devices)
  device_id: mic1        # Event.camera_id alanına yazılır
  zone_id: kantin
  window_s: 1.0          # model her seferinde son 1 sn'yi dinler
  hop_s: 0.5             # ...yarım saniyede bir
  emit_cooldown_s: 3.0   # aynı tip event'i detektör bu sıklıktan fazla basmaz
  reemit_delta: 0.1      # ...ama skor bu kadar yükselirse bekleme içinde de basar (olayın tepe skoru fusion'a ulaşsın)
  efficientat:
    model_name: mn10_as  # CPU zayıfsa: mn05_as / mn04_as (daha küçük, biraz daha az isabetli)
    sample_rate: 32000
    pad_to_s: 10         # model 10 sn kliplerle eğitildi; <3 sn girişte bozuk skor veriyor -> pencere sıfırla 10 sn'ye tamamlanır
  yamnet:
    model: models/yamnet.tflite
    sample_rate: 16000
  # AudioSet sınıf adı -> event tipi (iki model de AudioSet etiketlerini kullanır)
  # Bilerek dışarıda: "Glass" (kantinde bardak tıkırtısı), "Children shouting" (teneffüste sürekli), "Cap gun"
  class_map:
    Screaming: scream
    Shout: shout
    Yell: shout
    Bellow: shout
    Gunshot, gunfire: gunshot
    Machine gun: gunshot
    Fusillade: gunshot
    Shatter: glass
  # Tip bazında model seçimi: silah sesinde YAMNet çok daha iyi (CC0 4 silah kaydı: YAMNet 0.26-0.85,
  # EfficientAT 0.01-0.10). Diğer tipler ana modelden (backend). YAMNet yoksa ana modele düşer.
  type_backend:
    gunshot: yamnet
  # Modele göre event eşiği. efficientat ESC-50 testinde: cam kırılması 0.15-0.19, ilgisiz sesler (alkış, kapı,
  # bebek ağlaması, metro) <= 0.04. YAMNet silah: 4 silah kaydı 0.26-0.85; cam kırılması 0.20, alkış/kapı/metro <= 0.01.
  min_conf:
    efficientat: {scream: 0.15, shout: 0.15, gunshot: 0.15, glass: 0.05}   # cam: ESC-50 0.05 -> %45 yakalama, %0 yanlış alarm
    yamnet:      {scream: 0.2, shout: 0.2, gunshot: 0.25, glass: 0.2}
  # dB = dBFS + db_offset. Mikrofona göre kalibre edin: sessiz odada ~35-45, normal konuşmada ~55-65 göstermeli.
  db_offset: 100
  db_min_hops: 2         # eşik art arda bu kadar ölçümde aşılırsa (2 x 0.5 sn = 1 sn) "shout" event'i
  db_rule_on_files: false  # ses dosyasının seviyesi gerçek ortam gürültüsü değil (ciglik.wav'da film müziği "bağırma" sayıldı)
  # dB eşikleri: bölge tipine ve zamana göre (break = teneffüs, lesson = ders)
  db_thresholds:
    default: {lesson: 70, break: 85}
    gym:     {lesson: 85, break: 95}
    outdoor: {lesson: 80, break: 95}
    social:  {lesson: 75, break: 90}

# ---------------- Uyarı kuralları ----------------
alerts:
  red:
    weapon_min_conf: 0.6
    gunshot_min_conf: 0.4   # testte silah sesleri 0.41-0.80; cam kırılması YAMNet 0.20
  orange:
    scream_crowd_min_people: 4
    clip_seconds: 10
  yellow:
    shout_min_conf: 0.3
  escalation:
    yellow_count: 3            # aynı bölgede bu kadar sarı...
    window_s: 120              # ...bu süre içinde -> turuncu
  dedup_window_s: 30           # aynı bölge + aynı tip bu süre içinde tek uyarı
  auto_escalate_red:
    enabled: false             # İLKE: polis bildirimi otomatik değil. Varsayılan KAPALI.
    timeout_s: 120             # açıkken: kırmızı uyarı bu sürede onaylanmazsa SADECE ek bildirim + ekranda uyarı
                               # (gerçek arama / polis bildirimi YOK; karar yine insanda)

# Kime bildirim gider (rol bazlı)
recipients:
  yellow: [nobetci]
  orange: [nobetci, mudur_yrd, rehber]
  red: [nobetci, mudur_yrd, rehber, mudur]

privacy:
  blur_faces: true
  record_clips_for: [orange, red]
  # Yüz bulanıklaştırma (TANIMA YOK: sadece yerini bulup pikselleştirir). İki kaynağın birleşimi:
  # 1) poz keypoint'lerinden kafa bölgesi (burun/göz/kulak; yoksa omuzların üstü)
  # 2) yüz dedektörü (YuNet; model yoksa OpenCV Haar) -> pozun kaçırdığı yüzler için
  face_model: models/face_detection_yunet_2023mar.onnx
  face_conf: 0.3          # düşük tut: kaçırmak, fazla bulanıklaştırmaktan kötü
  person_conf: 0.1        # poz kafa bölgesi için kişi eşiği (kurallardaki pose.person_conf'tan bağımsız).
                          # Kavga.mp4'te kalabalıkta/yandan görünen kişiler 0.12-0.23 güvenle geliyordu.
  face_max_side: 640      # yüz dedektörü bu boyuta küçültülmüş karede çalışır (hız)
  head_scale: 1.0         # poz kafa kutusu çarpanı (yüz açıkta kalıyorsa büyütün)
  top_band: 0.18          # ayakta duran kişide kutunun üstten bu oranı da bulanıklaştırılır (keypoint kayarsa yedek)
  pad: 0.1                # her kutuya eklenen kenar payı (kısa kenarın oranı)
  pixel_blocks: 8         # kutu en fazla bu kadar bloğa pikselleştirilir (küçük = daha bulanık)
  persist_s: 0.5          # son bu kadar sn'de bulunan bölgeler de kapatılır (1-2 kare algılanmayan kişi için)

api:
  host: 127.0.0.1        # demo güvenliği: sadece bu bilgisayar. Telefondan göstermek için: python main.py --host 0.0.0.0
  port: 8000

telegram:
  enabled: true
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
