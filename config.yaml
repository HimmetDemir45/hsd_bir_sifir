# OkulKalkan ayarları. Tüm eşikler burada; kodda sabit eşik yok.
# ${DEGISKEN} biçimindeki değerler .env'den okunur.

general:
  device: cpu            # cpu | cuda
  imgsz: 640             # 480–640 arası; CPU yavaşsa 480 yapın
  target_fps: 8          # işleme hızı üst sınırı
  snapshot_dir: snapshots
  clip_dir: clips

# Kameralar ve bulundukları bölge
cameras:
  - id: cam1
    source: 0            # 0 = webcam, "rtsp://..." veya "test_media/kavga.mp4"
    zone_id: kantin

# Bölgeler: tip (eşikler tipe göre değişir) + kat planı poligonu (floorplan.png piksel koordinatları)
zones:
  kantin:     {name: Kantin,       type: social,  polygon: [[50, 50], [300, 50], [300, 200], [50, 200]]}
  koridor_1:  {name: 1. Kat Koridor, type: corridor, polygon: [[320, 50], [700, 50], [700, 120], [320, 120]]}
  spor_salonu: {name: Spor Salonu,  type: gym,     polygon: [[50, 220], [400, 220], [400, 450], [50, 450]]}
  bahce:      {name: Bahçe,        type: outdoor, polygon: [[420, 220], [700, 220], [700, 450], [420, 450]]}

# Ders / teneffüs çizelgesi (HH:MM). Bu aralıklar dışındaki zaman "ders" sayılır.
schedule:
  breaks:
    - ["10:10", "10:20"]
    - ["11:00", "11:10"]
    - ["12:30", "13:20"]   # öğle arası
    - ["14:00", "14:10"]

# ---------------- Detektörler ----------------
weapon:
  model: models/weapon.pt        # Roboflow weapon modeli
  fallback_model: models/yolo11n.pt  # weapon.pt yoksa: COCO, sadece knife sınıfı (ilk çalıştırmada otomatik iner)
  fallback_classes: {knife: knife}
  # Weapon modelindeki sınıf adı (küçük harf) -> event tipi. Listede olmayan sınıflar yok sayılır.
  class_map:
    gun: gun
    pistol: gun
    handgun: gun
    rifle: gun
    weapon: gun
    firearm: gun
    knife: knife
  min_conf: 0.6          # KIRMIZI için güven eşiği
  display_conf: 0.35     # bu ve üstü ekranda (gri) gösterilir; event üretmez
  window: 5              # son N kare
  min_hits: 3            # ...en az bu kadarında tespit
  emit_cooldown_s: 2.0   # aynı tip event'i detektör bu sıklıktan fazla basmaz (asıl dedup fusion'da)
  every_n_frames: 1      # silah tespiti her karede

pose:
  model: models/yolo11n-pose.pt
  every_n_frames: 2
  person_conf: 0.5             # kişi kutusu güven eşiği
  kp_conf: 0.4                 # keypoint bu güvenin altındaysa yok sayılır
  track_max_dist: 0.8          # kareler arası eşleştirme: merkez kayması < kişi boyu * oran
  track_ttl_s: 1.0             # bu süre görünmeyen kişi takipten düşer
  speed_ema: 0.5               # hız yumuşatma (0 = yumuşatma yok, 1'e yakın = çok yumuşak)
  emit_cooldown_s: 3.0         # aynı tip event'i detektör bu sıklıktan fazla basmaz
  fight:
    proximity_ratio: 0.6       # merkezler arası mesafe < kişi boyu * oran
    limb_speed: 1.5            # bilek/dirsek hızı (kişi boyu / sn)
    hold_s: 0.5                # hızlı hareket bu kadar süre "devam ediyor" sayılır (vuruşlar arası boşluk)
    gap_s: 0.7                 # kavga durumu bu kadar süre kesilirse sayaç sıfırlanır (kısa kopmaları tolere eder)
    min_duration_s: 1.0
  fall:
    torso_angle_deg: 60        # gövdenin dikeyle açısı bundan büyükse "yatay"
    aspect_ratio: 1.2          # keypoint yoksa: kutu genişlik/yükseklik bundan büyükse "yatay"
    min_duration_s: 3.0
  running:
    mean_speed: 1.2            # ortalama keypoint hızı (kişi boyu / sn)
    min_people: 2
    min_duration_s: 0.5
  crowd:
    min_people: 4
    radius_ratio: 1.5          # kişi boyu cinsinden kümelenme yarıçapı

audio:
  backend: efficientat   # efficientat (daha isabetli) | yamnet (yedek). efficientat yüklenemezse otomatik yamnet.
  input: default         # mikrofon: default veya cihaz numarası (python -m detectors.audio_cls --list-devices)
  device_id: mic1        # Event.camera_id alanına yazılır
  zone_id: kantin
  window_s: 1.0          # model her seferinde son 1 sn'yi dinler
  hop_s: 0.5             # ...yarım saniyede bir
  emit_cooldown_s: 3.0   # aynı tip event'i detektör bu sıklıktan fazla basmaz
  efficientat:
    model_name: mn10_as  # CPU zayıfsa: mn05_as / mn04_as (daha küçük, biraz daha az isabetli)
    sample_rate: 32000
    pad_to_s: 10         # model 10 sn kliplerle eğitildi; <3 sn girişte bozuk skor veriyor -> pencere sıfırla 10 sn'ye tamamlanır
  yamnet:
    model: models/yamnet.tflite
    sample_rate: 16000
  # AudioSet sınıf adı -> event tipi (iki model de AudioSet etiketlerini kullanır)
  # Bilerek dışarıda: "Glass" (kantinde bardak tıkırtısı), "Children shouting" (teneffüste sürekli), "Cap gun"
  class_map:
    Screaming: scream
    Shout: shout
    Yell: shout
    Bellow: shout
    Gunshot, gunfire: gunshot
    Machine gun: gunshot
    Fusillade: gunshot
    Shatter: glass
  # Modele göre event eşiği. efficientat ESC-50 testinde: cam kırılması 0.15-0.19, ilgisiz sesler (alkış, kapı,
  # bebek ağlaması, metro) <= 0.04. YAMNet cam kırılmasını 0.20 ile "silah" sandı -> gunshot eşiği yüksek.
  min_conf:
    efficientat: {scream: 0.15, shout: 0.15, gunshot: 0.15, glass: 0.12}
    yamnet:      {scream: 0.2, shout: 0.2, gunshot: 0.35, glass: 0.2}
  # dB = dBFS + db_offset. Mikrofona göre kalibre edin: sessiz odada ~35-45, normal konuşmada ~55-65 göstermeli.
  db_offset: 100
  db_min_hops: 2         # eşik art arda bu kadar ölçümde aşılırsa (2 x 0.5 sn = 1 sn) "shout" event'i
  db_rule_on_files: false  # ses dosyasının seviyesi gerçek ortam gürültüsü değil (ciglik.wav'da film müziği "bağırma" sayıldı)
  # dB eşikleri: bölge tipine ve zamana göre (break = teneffüs, lesson = ders)
  db_thresholds:
    default: {lesson: 70, break: 85}
    gym:     {lesson: 85, break: 95}
    outdoor: {lesson: 80, break: 95}
    social:  {lesson: 75, break: 90}

# ---------------- Uyarı kuralları ----------------
alerts:
  red:
    weapon_min_conf: 0.6
    gunshot_min_conf: 0.5
  orange:
    scream_crowd_min_people: 4
    clip_seconds: 10
  yellow:
    shout_min_conf: 0.3
  escalation:
    yellow_count: 3            # aynı bölgede bu kadar sarı...
    window_s: 120              # ...bu süre içinde -> turuncu
  dedup_window_s: 30           # aynı bölge + aynı tip bu süre içinde tek uyarı
  auto_escalate_red:
    enabled: false             # İLKE: polis bildirimi otomatik değil. Varsayılan KAPALI.
    timeout_s: 120

# Kime bildirim gider (rol bazlı)
recipients:
  yellow: [nobetci]
  orange: [nobetci, mudur_yrd, rehber]
  red: [nobetci, mudur_yrd, rehber, mudur]

privacy:
  blur_faces: true
  record_clips_for: [orange, red]
  # Yüz bulanıklaştırma (TANIMA YOK: sadece yerini bulup pikselleştirir). İki kaynağın birleşimi:
  # 1) poz keypoint'lerinden kafa bölgesi (burun/göz/kulak; yoksa omuzların üstü)
  # 2) yüz dedektörü (YuNet; model yoksa OpenCV Haar) -> pozun kaçırdığı yüzler için
  face_model: models/face_detection_yunet_2023mar.onnx
  face_conf: 0.3          # düşük tut: kaçırmak, fazla bulanıklaştırmaktan kötü
  person_conf: 0.1        # poz kafa bölgesi için kişi eşiği (kurallardaki pose.person_conf'tan bağımsız).
                          # Kavga.mp4'te kalabalıkta/yandan görünen kişiler 0.12-0.23 güvenle geliyordu.
  face_max_side: 640      # yüz dedektörü bu boyuta küçültülmüş karede çalışır (hız)
  head_scale: 1.0         # poz kafa kutusu çarpanı (yüz açıkta kalıyorsa büyütün)
  top_band: 0.18          # ayakta duran kişide kutunun üstten bu oranı da bulanıklaştırılır (keypoint kayarsa yedek)
  pad: 0.1                # her kutuya eklenen kenar payı (kısa kenarın oranı)
  pixel_blocks: 8         # kutu en fazla bu kadar bloğa pikselleştirilir (küçük = daha bulanık)
  persist_s: 0.5          # son bu kadar sn'de bulunan bölgeler de kapatılır (1-2 kare algılanmayan kişi için)

api:
  host: 0.0.0.0
  port: 8000

telegram:
  enabled: false
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
