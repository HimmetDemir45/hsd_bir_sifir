<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OkulKalkan</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>OkulKalkan</h1>
    <span id="conn" class="conn off">bağlantı yok</span>
    <button id="soundBtn" class="sound off" type="button">Alarm sesi kapalı (açmak için tıkla)</button>
  </header>
  <main>
    <section class="video">
      <h2>Canlı görüntü</h2>
      <img id="cam" src="/video/cam1" alt="Canlı kamera">
    </section>
    <section class="feed">
      <h2>Uyarılar <span id="count"></span></h2>
      <ul id="alerts"></ul>
    </section>
  </main>
  <main class="lower">
    <section>
      <h2>Kat planı: olay yoğunluğu</h2>
      <canvas id="plan" width="760" height="500"></canvas>
    </section>
    <section>
      <h2>Haftalık özet (son 7 gün)</h2>
      <table id="weekly">
        <thead><tr><th>Bölge</th><th class="y">Sarı</th><th class="o">Turuncu</th><th class="r">Kırmızı</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Kırmızı uyarı: tam ekran modal (insan onayı gerekir; 112 araması SİMÜLASYONDUR) -->
  <div id="redModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-title">🔴 KIRMIZI UYARI</div>
      <div id="redZone" class="modal-zone"></div>
      <img id="redSnap" class="modal-snap" alt="Uyarı görüntüsü">
      <ul id="redReasons"></ul>
      <div id="redActions" class="modal-actions">
        <button id="confirmBtn" class="btn confirm" type="button">Onayla: 112'yi ara (simülasyon)</button>
        <button id="dismissBtn" class="btn dismiss" type="button">Yanlış alarm</button>
      </div>
      <div id="redResult" class="modal-result" hidden>
        <p>✅ 112 arandı (simülasyon)</p>
        <p>✅ Tüm öğretmenlere "sınıfta kalın" mesajı gönderildi</p>
        <button id="closeBtn" class="btn dismiss" type="button">Kapat</button>
      </div>
    </div>
  </div>

  <audio id="alarm" src="/alarm.wav" loop preload="auto"></audio>
  <script src="/app.js"></script>
</body>
</html>
